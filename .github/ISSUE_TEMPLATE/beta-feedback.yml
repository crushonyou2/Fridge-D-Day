name: 유지보수 이슈
description: Archived 프로젝트의 보안 또는 빌드 재현성 문제만 기록합니다.
title: "[Maintenance] "
body:
  - type: markdown
    attributes:
      value: |
        프로젝트는 v1.0 Released / v1.1 QA No-Go / Archived 상태입니다.
        추가 사용자 베타, OCR 개선, 신규 기능, v1.1 출시와 스토어 업데이트는 진행하지 않습니다.
        식품 사진, 개인 식품 기록, 정답 원본, 비밀값은 첨부하지 마세요.
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: 재현에 필요한 OS, JDK, Android SDK 또는 빌드 도구 버전만 적어주세요.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 보안 또는 빌드 재현성 문제
      description: 공개 정보만으로 재현 절차, 기대 결과와 실제 결과를 적어주세요.
    validations:
      required: true
