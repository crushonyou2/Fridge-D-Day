<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bgGradient)"/>

  <!-- Refrigerator icon (larger, left side) - coordinates already transformed -->
  <g>
    <!-- Refrigerator body -->
    <path fill="#FFFFFF" d="M150,125 L270,125 C277.5,125 285,132.5 285,140 L285,320 C285,327.5 277.5,335 270,335 L150,335 C142.5,335 135,327.5 135,320 L135,140 C135,132.5 142.5,125 150,125 Z"/>
    <!-- Door separator -->
    <path fill="#81C784" d="M135,220 L285,220 L285,230 L135,230 Z"/>
    <!-- Top handle -->
    <path fill="#81C784" d="M160,170 L180,170 L180,195 L160,195 Z"/>
    <!-- Bottom handle -->
    <path fill="#81C784" d="M160,270 L180,270 L180,295 L160,295 Z"/>
    <!-- Leaf decoration -->
    <path fill="#A5D6A7" d="M230,145 C230,145 247.5,135 265,150 C280,165 272.5,185 257.5,180 C242.5,175 225,165 230,145 Z"/>
    <path fill="#C8E6C9" d="M240,150 C240,150 252.5,145 265,157.5 C275,170 270,180 260,177.5 C250,175 235,165 240,150 Z"/>
  </g>

  <!-- App name and tagline (moved left to avoid overlap) -->
  <text x="350" y="180" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#FFFFFF">오늘도 신선</text>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" opacity="0.95">똑똑한 식품 유통기한 관리</text>
  <text x="350" y="320" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" opacity="0.9">🌱 음식물 낭비 제로, OCR 자동 인식</text>

  <!-- Decorative elements (food emojis as text) -->
  <text x="850" y="100" font-size="60" opacity="0.3">🥗</text>
  <text x="920" y="190" font-size="50" opacity="0.3">🥛</text>
  <text x="860" y="280" font-size="55" opacity="0.3">🍎</text>
  <text x="900" y="380" font-size="50" opacity="0.3">🥕</text>
</svg>
